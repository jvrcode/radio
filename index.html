<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="card">

  <div class="top-row">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="3.5" fill="white"/>
          <path d="M7.5 7.5C5.5 9.5 5.5 14.5 7.5 16.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M16.5 7.5C18.5 9.5 18.5 14.5 16.5 16.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M4.5 4.5C1.5 7.5 1.5 16.5 4.5 19.5" stroke="white" stroke-width="1.4" stroke-linecap="round" opacity=".5"/>
          <path d="M19.5 4.5C22.5 7.5 22.5 16.5 19.5 19.5" stroke="white" stroke-width="1.4" stroke-linecap="round" opacity=".5"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Radio Colectivo 2026</div>
        <div class="brand-sub">Podcast Station</div>
      </div>
    </div>
    <div class="toggle-wrap">
      <span class="toggle-label" id="theme-lbl">Dark</span>
      <label class="toggle">
        <input type="checkbox" id="theme-chk">
        <div class="toggle-track"></div>
        <div class="toggle-knob"></div>
      </label>
    </div>
  </div>

  <div class="status-chip" id="chip">
    <span class="status-dot"></span>
    <span class="status-text" id="chip-txt">Offline</span>
  </div>

  <div class="eq-section">
    <div class="eq-label">Signal Monitor</div>
    <div class="eq-bars" id="eq-bars"></div>
  </div>

  <div class="url-wrap">
    <input type="hidden" id="stream-url" value="https://radio.jvrcode.com/stream">
  </div>

  <audio id="audio" preload="none"></audio>

  <div class="play-area">
    <button class="btn-play" id="btn-play">
      <svg id="ico-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="ico-stop" viewBox="0 0 24 24" style="display:none"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
    </button>
    <div class="play-info">
      <div class="play-title" id="play-title">Studio Live</div>
      <div class="play-host" id="play-host">—</div>
    </div>
  </div>

  <div class="vol-row">
    <span class="vol-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 010 7.07"/>
        <path d="M19.07 4.93a10 10 0 010 14.14"/>
      </svg>
    </span>
    <input type="range" id="vol-range" min="0" max="100" value="85">
    <span class="vol-val" id="vol-val">85%</span>
  </div>


</div>

<div class="chat-outer">
  <button id="chat-btn" class="chat-btn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
    <span class="chat-btn-text">Live Chat</span>
  </button>
  <div id="chat-widget">
    <iframe src="https://app1.jvrcode.com"></iframe>
  </div>
</div>
<script src="/js/script.js"></script>
</body>
</html>
